<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="header">
    <div class="header-left">
      <div id="clock" class="clock">00:00:00</div>
      <div id="date" class="date">Monday, January 1, 2026</div>
    </div>
    <div class="header-right">
      <button id="theme-toggle" class="btn-icon" title="Toggle dark/light mode" aria-label="Toggle theme">
        <span id="theme-icon">🌙</span>
      </button>
      <button id="settings-btn" class="btn-icon" title="Settings" aria-label="Open settings">
        ⚙️
      </button>
    </div>
  </header>

  <!-- ===== GREETING ===== -->
  <section class="greeting-section">
    <h1 id="greeting" class="greeting">Good morning, Friend!</h1>
    <p class="greeting-sub">Here's your dashboard for today.</p>
  </section>

  <!-- ===== MAIN GRID ===== -->
  <main class="dashboard-grid">

    <!-- FOCUS TIMER -->
    <section class="card timer-card" aria-label="Focus Timer">
      <div class="card-header">
        <h2 class="card-title">⏱ Focus Timer</h2>
        <button id="timer-settings-btn" class="btn-text" aria-label="Edit timer duration">Edit</button>
      </div>

      <!-- Timer duration editor (hidden by default) -->
      <div id="timer-edit" class="timer-edit hidden">
        <label for="pomodoro-input">Work (min)</label>
        <input type="number" id="pomodoro-input" class="input-sm" min="1" max="120" value="25" />
        <label for="break-input">Break (min)</label>
        <input type="number" id="break-input" class="input-sm" min="1" max="60" value="5" />
        <button id="timer-save-btn" class="btn-primary btn-sm">Save</button>
      </div>

      <div class="timer-mode-tabs">
        <button class="mode-tab active" data-mode="work">Work</button>
        <button class="mode-tab" data-mode="break">Break</button>
      </div>

      <div class="timer-display" aria-live="polite">
        <span id="timer-display">25:00</span>
      </div>

      <div class="timer-progress-bar">
        <div id="timer-progress" class="timer-progress-fill"></div>
      </div>

      <div class="timer-controls">
        <button id="timer-start" class="btn-primary">▶ Start</button>
        <button id="timer-stop" class="btn-secondary">⏸ Pause</button>
        <button id="timer-reset" class="btn-ghost">↺ Reset</button>
      </div>

      <div class="timer-session-count">
        Session <span id="session-count">1</span>
      </div>
    </section>

    <!-- TO-DO LIST -->
    <section class="card todo-card" aria-label="To-Do List">
      <div class="card-header">
        <h2 class="card-title">✅ To-Do List</h2>
        <span id="task-count" class="badge">0 left</span>
      </div>

      <div class="todo-input-row">
        <input
          type="text"
          id="task-input"
          class="input-text"
          placeholder="Add a new task…"
          maxlength="120"
          aria-label="New task text"
        />
        <button id="add-task-btn" class="btn-primary" aria-label="Add task">Add</button>
      </div>

      <div class="todo-filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="done">Done</button>
      </div>

      <ul id="task-list" class="task-list" aria-label="Tasks">
        <!-- tasks rendered by JS -->
      </ul>

      <div class="todo-footer">
        <button id="clear-done-btn" class="btn-ghost btn-sm">Clear completed</button>
      </div>
    </section>

    <!-- QUICK LINKS -->
    <section class="card links-card" aria-label="Quick Links">
      <div class="card-header">
        <h2 class="card-title">🔗 Quick Links</h2>
      </div>

      <div class="add-link-form">
        <input
          type="text"
          id="link-name-input"
          class="input-text"
          placeholder="Label (e.g. GitHub)"
          maxlength="30"
          aria-label="Link label"
        />
        <input
          type="url"
          id="link-url-input"
          class="input-text"
          placeholder="https://example.com"
          aria-label="Link URL"
        />
        <button id="add-link-btn" class="btn-primary">Add</button>
      </div>

      <div id="links-grid" class="links-grid" aria-label="Quick links list">
        <!-- links rendered by JS -->
      </div>
    </section>

  </main>

  <!-- ===== SETTINGS MODAL ===== -->
  <div id="settings-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="modal">
      <div class="modal-header">
        <h2 id="settings-title">Settings</h2>
        <button id="settings-close" class="btn-icon" aria-label="Close settings">✕</button>
      </div>
      <div class="modal-body">
        <label class="settings-label" for="custom-name-input">Your Name (used in greeting)</label>
        <input
          type="text"
          id="custom-name-input"
          class="input-text"
          placeholder="Enter your name…"
          maxlength="40"
        />
        <button id="save-name-btn" class="btn-primary">Save Name</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
